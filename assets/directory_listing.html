<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directory listing</title>
  <style>
    :root {
      --border-col: oklch(44.2% 0.017 285.786);
      --fg: oklch(87.1% 0.006 286.286);
      --light-fg: oklch(70.5% 0.015 286.067);
      --highlight: oklch(60.6% 0.25 292.717);
      --highlight-2: oklch(49.1% 0.27 292.581);
    }

    html {
      height: 100dvh;
      overflow-y: clip;
      background: linear-gradient(in oklab, oklch(28.3% 0.141 291.089), oklch(38% 0.189 293.745));
      display: flex;
      flex-direction: column;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: var(--fg);
      display: flex;
      flex-grow: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      gap: 5px;
      padding: 5pt;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    input[type=submit] {
      background-color: var(--highlight-2);
      width: 100%;
      padding: 1em;
      border-radius: 1em;
      color: var(--fg);
      font-size: 1em;
      border: none;
      box-shadow: 0 4px 6px -1px black, 0 2px 4px -2px black;
      transition: all 0.2s;
      font-weight: 800;
    }

    input[type=submit]:hover {
      transform: translateY(2px);
    }

    input[type=submit]:active {
      background-color: var(--highlight);
    }

    table {
      background-color: oklch(27.4% 0.006 286.033);
      border-collapse: collapse;
      min-width: 100%;
    }

    #table-wrap {
      width: 100%;
      max-width: 600px;
      border: 1pt solid;
      border-color: var(--border-col);
      border-radius: 1em;
      overflow: auto;
      flex-grow: 1;
      box-shadow: 0 4px 6px -1px black, 0 2px 4px -2px black;
    }

    th {
      font-weight: bolder;
      color: var(--light-fg);
    }

    th,
    td {
      padding: 0.5em;
    }

    th:nth-child(1),
    td:nth-child(1) {
      text-align: center;
      min-width: max-content;
      width: 50px;
      border-right: 1px solid;
      border-color: var(--border-col);
    }

    a {
      color: var(--highlight);
      font-weight: bold;
    }

    a:visited {
      color: var(--highlight-2);
    }
  </style>
</head>

<body>
  <form method="dialog" id="uploadForm">
    <input type="file" id="fileInput" multiple />
    <input type="submit" name="send" value="upload">
  </form>
  <div id="progressBarContainer"></div>
  <script>
    const toBytesDisplay = (bytecount) => {
      const UNITS = ['B/s', 'KB/s', 'MB/s', 'GB/s', 'TB/s']
      for (const suffix of UNITS) {
        if (bytecount < 1000)
          return `${bytecount.toPrecision(3)} ${suffix}`;
        bytecount /= 1000;
      }
      return bytecount;
    };
    const el = (type, ...children) => {
      const e = document.createElement(type);
      e.append(...children);
      return e;
    };
    const elProps = (type, props, ...children) => {
      const e = document.createElement(type);
      for (const p in props) e[p] = props[p];
      e.append(...children);
      return e;
    };
    const fileInput = document.getElementById("fileInput");
    const progressBarContainer = document.getElementById("progressBarContainer");
    document.getElementById("uploadForm").onsubmit =
      () => Promise.allSettled(
        [...fileInput.files].map(file =>
          new Promise((resolve) => {
            const progressEl = el(
              "progress",
            );
            const speedText = el("p", "(...)");
            const myProgressBar = el("p", el("label", `Uploading ${file.name}`, speedText, progressEl));

            const req = new XMLHttpRequest();
            req.upload.onloadstart = (ev) => {
              progressEl.value = ev.loaded;
              progressEl.max = ev.total;
              progressBarContainer.append(myProgressBar);
            };

            let lastProgressEventTimestamp = Date.now();
            let lastProgressEventBytes = 0;
            req.upload.onprogress = (ev) => {
              console.assert(ev.lengthComputable);
              progressEl.value = ev.loaded;
              progressEl.max = ev.total;

              const now = Date.now();
              const speed = (ev.loaded - lastProgressEventBytes) / (now - lastProgressEventTimestamp) * 1000;
              speedText.textContent = `(${toBytesDisplay(speed)})`
              lastProgressEventTimestamp = now;
              lastProgressEventBytes = ev.loaded;
            };
            req.upload.onloadend = (ev) => {
              myProgressBar.remove();
              resolve();
            };
            req.onloadend = () => {
              myProgressBar.remove();
              resolve(
                req.status >= 300
                  ? `${file.name} -> ${req.responseText.trim()}`
                  : undefined
              );
            };
            const path = window.location.pathname.endsWith("/")
              ? window.location.pathname + file.name
              : `${window.location.pathname}/${file.name}`
            req.open("PUT", path, true);
            req.send(file);
          })
        )
      ).then((responses) => {
        responses = responses.flatMap(it => it.value ? [it.value] : []);
        if (responses.length > 0) alert(
          "Some files failed:\n" +
          responses.map(r => `${r}`).join(",\n")
        );
        window.location.reload()
      })
  </script>
  <div id="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Size</th>
          <th>Name</th>
        </tr>
      </thead>
      <tbody>
        <?TEMPLATE?>
      </tbody>
    </table>
  </div>
</body>

</html>
